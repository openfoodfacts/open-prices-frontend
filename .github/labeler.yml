# For reference, please look at https://github.com/actions/labeler

GitHub Actions:
  - changed-files:
      - any-glob-to-any-file: ".github/**/*"

🧪 Tests:
  - changed-files:
      - any-glob-to-any-file: "tests/**/*"
      - any-glob-to-any-file: "cypress.config.js"

📚 Documentation:
  - all:
      - changed-files:
          - any-glob-to-any-file: "*.md"
          - all-globs-to-all-files: "!CHANGELOG.md"

dependencies:
  - changed-files:
      - any-glob-to-any-file: "package.json"
      - any-glob-to-any-file: "yarn.lock"

Price addition:
  - changed-files:
      - any-glob-to-any-file: "src/views/PriceAdd*.vue"
      - any-glob-to-any-file: "src/components/PriceAddLink.vue"
      - any-glob-to-any-file: "src/components/PriceAlreadyUploadedListCard.vue"
      - any-glob-to-any-file: "src/components/PriceInputRow.vue"

