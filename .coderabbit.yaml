# CodeRabbit configuration
# See https://docs.coderabbit.ai/getting-started/configure-coderabbit
reviews:
  path_filters:
    # translation files are synced from Crowdin (1 file per language),
    # excluding them keeps PRs under the 100 files review limit
    - "!src/i18n/locales/**"
    # taxonomy data files are generated by the update-generated-data workflow (1 file per language)
    - "!src/data/categories/**"
    - "!src/data/countries/**"
    - "!src/data/labels/**"
    - "!src/data/origins/**"
